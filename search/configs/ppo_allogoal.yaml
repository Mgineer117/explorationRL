label: ppo+allog
algorithm: ppo_allogoal
# PPO is on-policy and benefits from massively parallel envs.
num_envs: 4096

extra_args: ["--agent", "skrl_ppo_cfg_entry_point", "--int_reward", "allo_kernel",
             "--allo_positional_indices", "0", "1", "--goal_indices", "6", "7"]

metric:
  name: "Reward / True total reward (mean)"
  goal: maximize

parameters:
  agent.discount_factor:
    values: [0.95, 0.98, 0.99, 0.995]
  agent.gae_lambda:
    values: [0.9, 0.95, 0.97, 1.0]
  agent.ratio_clip:
    values: [0.1, 0.2, 0.3]
  agent.entropy_loss_scale:
    values: [0.0, 0.001, 0.01]
  agent.learning_rate:
    values: [0.0001, 0.0003, 0.001]
  agent.learning_epochs:
    values: [4, 8, 16]
  agent.rollouts:
    values: [16, 32, 64]
  agent.mini_batches:
    values: [4, 8, 16]
  agent.value_clip:
    values: [0.1, 0.2, 0.4]
  agent.value_loss_scale:
    values: [0.5, 1.0, 2.0]
  agent.grad_norm_clip:
    values: [0.5, 1.0, 2.0]
  models.policy.initial_log_std:
    values: [-1.0, 0.0, 1.0]
  # Bare key (no "agent." prefix): int_reward_coef isn't part of the agent
  # config, it's train.py's own --int_reward_coef flag (how strongly the
  # ALLOGoal potential is blended into the training reward, see
  # apply_wandb_sweep_overrides). 0.1 was an arbitrary fixed guess before;
  # searching it directly tests whether the reward-blending pathway just
  # needed a different scale, not only different PPO hyperparameters.
  int_reward_coef:
    values: [0.01, 0.03, 0.1, 0.3, 1.0]
