label: ppo
algorithm: ppo
# PPO is on-policy and benefits from massively parallel envs.
num_envs: 4096

metric:
  name: "Reward / Total reward (mean)"
  goal: maximize

parameters:
  agent.discount_factor:
    values: [0.95, 0.98, 0.99, 0.995]
  agent.gae_lambda:
    values: [0.9, 0.95, 0.97, 1.0]
  agent.ratio_clip:
    values: [0.1, 0.2, 0.3]
  agent.entropy_loss_scale:
    values: [0.0, 0.001, 0.01]
  agent.learning_rate:
    values: [0.0001, 0.0003, 0.001]
  agent.learning_epochs:
    values: [4, 8, 16]
