label: hrl
algorithm: hrl
num_envs: 4096

metric:
  name: "Reward / Total reward (mean)"
  goal: maximize

parameters:
  agent.discount_factor:
    values: [0.98, 0.99, 0.995]
  agent.learning_rate:
    values: [0.0001, 0.0003, 0.001]
  # hierarchy
  agent.num_options:
    values: [2, 4, 8]
  agent.option_horizon:
    values: [4, 8, 16, 32]
  agent.controller_learning_rate:
    values: [0.0001, 0.0003, 0.001]
  agent.controller_entropy_scale:
    values: [0.0, 0.01, 0.05]
  agent.option_learning_rate:
    values: [0.0, 0.0003]          # 0.0 = frozen options
  agent.intrinsic_reward_type:
    values: [allo, random]
