label: drnd
algorithm: drnd
# DRND is PPO-based (on-policy) and benefits from massively parallel envs.
num_envs: 4096

metric:
  name: "Reward / Total reward (mean)"
  goal: maximize

parameters:
  # PPO backbone
  agent.discount_factor:
    values: [0.98, 0.99, 0.995]
  agent.gae_lambda:
    values: [0.9, 0.95, 0.97]
  agent.learning_rate:
    values: [0.0001, 0.0003, 0.001]
  # DRND novelty bonus
  agent.alpha:
    values: [0.5, 0.7, 0.9, 1.0]
  agent.intrinsic_reward_scale:
    values: [0.1, 0.5, 1.0, 2.0]
  agent.extrinsic_reward_scale:
    values: [1.0, 2.0]
  agent.update_proportion:
    values: [0.25, 0.5, 1.0]
  agent.num_targets:
    values: [5, 10]
