# skrl AGA configuration for PointMaze, critic zero-initialized.
# Identical to skrl_aga_cfg.yaml except zero_init_critic: true -- see
# skrl_ppo_zic_cfg.yaml / explorationRL/agents/skrl/runner.py for the
# motivation (an untrained critic's early noise, shared into the policy's own
# trunk via models.separate: false, may drive the premature exploration
# collapse observed across every condition tried so far).
seed: 42
zero_init_critic: true

models:
  separate: false
  policy:  # gaussian_model
    class: GaussianMixin
    clip_actions: false
    clip_log_std: true
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 256]
        activations: elu
    output: ACTIONS
  value:  # deterministic_model
    class: DeterministicMixin
    clip_actions: false
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 256]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1  # auto (= agent.rollouts)

agent:
  class: AGA
  rollouts: 32
  learning_epochs: 10        # PPO inner-loop epochs (n_epochs in the spec)
  mini_batches: 8
  discount_factor: 0.99
  gae_lambda: 0.95
  learning_rate: 3.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 0.5
  ratio_clip: 0.2
  value_clip: 0.2
  entropy_loss_scale: 0.0
  value_loss_scale: 1.0
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: true
  # ── AGA ───────────────────────────────────────────────────────────────────
  precond_beta: 2.0
  precond_damp: 0.9
  precond_tau: 0.05
  v_hat_momentum: 0.8
  alpha_start: 1.0
  alpha_end: 0.3
  alpha_anneal_updates: 300
  target_dist: bottleneck
  meta_gamma: 0.99
  novelty_coef: 0.0
  dense_coef: 1.0
  entropy_start: 0.0
  entropy_end: 0.0
  entropy_anneal_updates: 1000
  experiment:
    directory: pointmaze
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto
    wandb: true
    wandb_kwargs:
      project: explorationRL

trainer:
  class: SequentialTrainer
  timesteps: 100000
  environment_info: log
