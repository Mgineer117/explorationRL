# skrl SAC configuration for PointMaze (stock skrl 2.1 model/agent format).
# SAC is off-policy: far fewer parallel envs, large replay buffer.
seed: 42

models:
  separate: true
  policy:  # gaussian_model — clip_actions bounds the sampled action for SAC
    class: GaussianMixin
    clip_actions: true
    clip_log_std: true
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 256]
        activations: relu
    output: ACTIONS
  critic_1:
    class: DeterministicMixin
    clip_actions: false
    network:
      - name: net
        input: concatenate([OBSERVATIONS, ACTIONS])
        layers: [256, 256]
        activations: relu
    output: ONE
  critic_2:
    class: DeterministicMixin
    clip_actions: false
    network:
      - name: net
        input: concatenate([OBSERVATIONS, ACTIONS])
        layers: [256, 256]
        activations: relu
    output: ONE
  target_critic_1:
    class: DeterministicMixin
    clip_actions: false
    network:
      - name: net
        input: concatenate([OBSERVATIONS, ACTIONS])
        layers: [256, 256]
        activations: relu
    output: ONE
  target_critic_2:
    class: DeterministicMixin
    clip_actions: false
    network:
      - name: net
        input: concatenate([OBSERVATIONS, ACTIONS])
        layers: [256, 256]
        activations: relu
    output: ONE

memory:
  class: RandomMemory
  memory_size: 50000

agent:
  class: SAC
  gradient_steps: 1
  batch_size: 4096
  discount_factor: 0.99
  polyak: 0.005
  learning_rate: 3.0e-04
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 1000
  grad_norm_clip: 1.0
  learn_entropy: true
  initial_entropy_value: 0.2
  rewards_shaper_scale: 1.0
  experiment:
    directory: pointmaze
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto
    wandb: true
    wandb_kwargs:
      project: explorationRL

trainer:
  class: SequentialTrainer
  timesteps: 100000
  environment_info: log
