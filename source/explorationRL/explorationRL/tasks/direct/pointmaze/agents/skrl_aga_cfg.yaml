# skrl AGA configuration for PointMaze.
# AGA = plain PPO inner loop, then the realized parameter update is reshaped by
# an asymmetric rank-1 PD preconditioner toward a REINFORCE exploration direction
# (maze doorway cells by default) instead of augmenting the reward
# (see explorationRL/agents/skrl/aga.py).
seed: 42

models:
  separate: false
  policy:  # gaussian_model
    class: GaussianMixin
    clip_actions: false
    clip_log_std: true
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 256]
        activations: elu
    output: ACTIONS
  value:  # deterministic_model
    class: DeterministicMixin
    clip_actions: false
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 256]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1  # auto (= agent.rollouts)

agent:
  class: AGA
  rollouts: 32
  learning_epochs: 10        # PPO inner-loop epochs (n_epochs in the spec)
  mini_batches: 8
  discount_factor: 0.99
  gae_lambda: 0.95
  learning_rate: 3.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 0.5
  ratio_clip: 0.2
  value_clip: 0.2
  entropy_loss_scale: 0.0
  value_loss_scale: 1.0
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: true
  # ── AGA ───────────────────────────────────────────────────────────────────
  # delta_ppo = the realized multi-epoch PPO step above; v_hat = a single-pass
  # REINFORCE direction toward target_dist cells; g_tilde reshapes delta_ppo by
  # an asymmetric rank-1 PD map along v_hat, applied at an annealed step size.
  precond_beta: 2.0        # scale when <v_hat, delta_ppo> > 0
  precond_damp: 0.9        # scale magnitude when <v_hat, delta_ppo> < 0, in [0, 1)
  alpha_start: 1.0
  alpha_end: 0.3
  alpha_anneal_updates: 300
  # bottleneck | uniform | far_from_start | intrinsic
  # `intrinsic` uses infos["int_reward"] from the env wrapper instead of the maze
  # layout — requires train.py --int_reward drnd|allo.
  target_dist: bottleneck
  meta_gamma: 0.99
  novelty_coef: 0.0          # 0 = all exploration pressure from the preconditioner
  dense_coef: 1.0            # dense -distance-to-goal shaping, folded into the PPO inner-loop reward only
  experiment:
    directory: pointmaze
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto
    wandb: true
    wandb_kwargs:
      project: explorationRL

trainer:
  class: SequentialTrainer
  timesteps: 100000
  environment_info: log
