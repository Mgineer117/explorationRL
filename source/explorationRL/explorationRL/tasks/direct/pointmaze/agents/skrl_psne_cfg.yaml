# skrl PSNE configuration for PointMaze.
# PSNE = TRPO + adaptive parameter-space noise (Plappert et al., 2017), so every
# TRPO field applies; the extra keys at the end are the noise knobs
# (see explorationRL/agents/skrl/psne.py).
seed: 42

models:
  separate: true
  policy:
    class: GaussianMixin
    clip_actions: false
    clip_log_std: true
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 256]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: false
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 256]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1  # auto (= agent.rollouts)

agent:
  class: PSNE
  # ── TRPO ──────────────────────────────────────────────────────────────────
  rollouts: 32
  learning_epochs: 8
  mini_batches: 8
  discount_factor: 0.99
  gae_lambda: 0.95
  learning_rate: 3.0e-04  # value network only
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  value_loss_scale: 1.0
  damping: 0.1
  max_kl_divergence: 0.01
  conjugate_gradient_steps: 10
  max_backtrack_steps: 10
  accept_ratio: 0.5
  step_fraction: 1.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: true
  # ── parameter-space noise ─────────────────────────────────────────────────
  initial_noise_std: 0.1
  noise_adaptation_coefficient: 1.01
  noise_kl_threshold: 0.03
  noise_kl_sample_size: 512
  experiment:
    directory: pointmaze
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto
    wandb: true
    wandb_kwargs:
      project: explorationRL

trainer:
  class: SequentialTrainer
  timesteps: 100000
  environment_info: log
