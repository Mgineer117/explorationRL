# skrl IRPO configuration for PointMaze.
# IRPO = a base policy optimised by TRPO along an aggregated *surrogate* gradient
# built from several intrinsic-reward-driven MAML-style adaptations of that base
# policy, over an ALLO Laplacian representation learned offline and then frozen
# (see explorationRL/agents/skrl/irpo.py).
seed: 42

models:
  # separate networks: each option policy is a deep copy of `policy`, so a
  # shared policy/value trunk would be duplicated per option (and its cached
  # forward pass aliases across roles — see irpo.py's act()).
  separate: true
  policy:  # gaussian_model
    class: GaussianMixin
    clip_actions: false
    clip_log_std: true
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 256]
        activations: elu
    output: ACTIONS
  value:  # deterministic_model
    class: DeterministicMixin
    clip_actions: false
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 256]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1  # auto (= agent.rollouts)

agent:
  class: IRPO
  rollouts: 32
  learning_epochs: 8
  mini_batches: 8
  discount_factor: 0.99
  gae_lambda: 0.95
  learning_rate: 3.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  entropy_loss_scale: 0.0
  value_loss_scale: 1.0
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: true
  # ── IRPO ──────────────────────────────────────────────────────────────────
  # For each option: clone the base policy, take num_exp_updates inner steps
  # (intrinsic advantage, then extrinsic on the last), and fold the result into a
  # surrogate gradient of the extrinsic objective. Aggregate across options and
  # apply to the base policy by TRPO.
  num_options: 4
  num_exp_updates: 2
  inner_learning_rate: 0.01
  entropy_scaler: 0.0
  critic_learning_rate: 0.001
  critic_epochs: 5
  meta_batch_size: 4096          # transitions for the 2nd-order adaptation + TRPO KL
  perf_gain_beta: 0.9
  aggregation_method: softmax     # softmax | argmax | uniform
  aggregation_temperature: 1.0
  base_target_kl: 0.01            # TRPO trust region for the base policy
  trpo_damping: 0.1
  trpo_cg_iters: 10
  trpo_backtrack_iters: 10
  trpo_backtrack_coeff: 0.7
  intrinsic_reward_type: allo     # allo | random (frozen-encoder ablation)
  # ALLO representation learner (trained offline on a uniform buffer, then frozen)
  extractor_feature_dim: 8
  extractor_hidden_dim: [256, 256]
  extractor_learning_rate: 0.001
  extractor_batch_size: 512
  extractor_discount: 0.9
  extractor_positional_indices: [0, 1]   # PointMaze xy
  extractor_pretrain_epochs: 5000
  extractor_collect_steps: 256
  extractor_uniform_reset: true
  extractor_cache_dir: model
  experiment:
    directory: pointmaze
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto
    wandb: true
    wandb_kwargs:
      project: explorationRL

trainer:
  class: SequentialTrainer
  timesteps: 100000
  environment_info: log
