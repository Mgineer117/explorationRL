# skrl DRND configuration for PointMaze.
# DRND = PPO + a Distributional Random Network Distillation novelty bonus, so
# every PPO field applies; the extra keys at the end are the DRND knobs
# (see explorationRL/agents/skrl/drnd.py).
seed: 42

models:
  separate: false
  policy:
    class: GaussianMixin
    clip_actions: false
    clip_log_std: true
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 256]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: false
    network:
      - name: net
        input: OBSERVATIONS
        layers: [256, 256]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1  # auto (= agent.rollouts)

agent:
  class: DRND
  # ── PPO ───────────────────────────────────────────────────────────────────
  rollouts: 32
  learning_epochs: 8
  mini_batches: 8
  discount_factor: 0.99
  gae_lambda: 0.95
  learning_rate: 3.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  entropy_loss_scale: 0.0
  value_loss_scale: 1.0
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: true
  # ── DRND ──────────────────────────────────────────────────────────────────
  num_targets: 5
  embedding_dim: 64
  predictor_hidden: [512, 512, 512]
  target_hidden: [128, 128]
  alpha: 0.9
  intrinsic_reward_scale: 1.0
  extrinsic_reward_scale: 2.0
  drnd_loss_scale: 1.0
  update_proportion: 0.25
  predictor_learning_rate: 3.0e-04
  experiment:
    directory: pointmaze
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto
    wandb: true
    wandb_kwargs:
      project: explorationRL

trainer:
  class: SequentialTrainer
  timesteps: 100000
  environment_info: log
